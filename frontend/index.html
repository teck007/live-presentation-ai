<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Presentation AI — Habla. Tus diapositivas aparecen.</title>
    <meta
      name="description"
      content="Live Presentation AI genera tus diapositivas en vivo mientras hablas: transcripción en tiempo real, 21 diseños automáticos y presentación en pantalla completa."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Live Presentation AI — Habla. Tus diapositivas aparecen." />
    <meta
      property="og:description"
      content="Habla de tu tema y mira cómo tus diapositivas aparecen en vivo. Sin preparar nada, todo en tu navegador."
    />
    <meta property="og:locale" content="es_ES" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310b981'/%3E%3Ccircle cx='16' cy='16' r='7' fill='white'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2310b981'/%3E%3C/svg%3E"
    />
    <script>
      // Pre-mount theme: stored choice wins, else OS preference. No animations here.
      (function () {
        try {
          var stored = localStorage.getItem("lp-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              stored !== "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches) ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
